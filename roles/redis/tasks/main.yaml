- name: enable redis 7
  command: dnf module enable redis:7 -y

- name: install redis 7
  ansible.builtin.dnf:
    name: redis
    state: present

- name: allow remote connections
  replace:
    path: /etc/redis/redis.conf
    regexp: 127.0.0.1
    replace: 0.0.0.0

- name: disable protected mode
  lineinfile:
    path: /etc/redis/redis.conf
    regexp: "^#?Sprotected-mode yes"
    line: "protected-mode no"

- name: enable and start redis
  ansible.builtin.service:
    name: redis
    state: restarted
    enabled: yes