- name: application setup
  include_role:
    name: common
    tasks_from: app-setup.yaml

- name: nodejs setup
  include_role:
    name: common
    tasks_from: nodejs.yaml

- name: copy cart service
  template:
    src: cart.service.j2
    dest: /etc/systemd/system/cart.service

- name: systemd setup
  include_role:
    name: common
    tasks_from: systemd-setup.yaml