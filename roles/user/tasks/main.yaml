- name: application setup
  include_role:
    name: common
    tasks_from: app-setup.yaml

- name: nodejs setup
  include_role:
    name: common
    tasks_from: nodejs.yaml

- name: copy user service
  template:
    src: user.service.j2
    dest: /etc/systemd/system/user.service

- name: systemd setup
  include_role:
    name: common
    tasks_from: systemd-setup.yaml